name: Netflix Clone CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # ✅ AWS Credentials (FIXED)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1   # ✅ IMPORTANT (no 'region')

    # ✅ Login to ECR
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1

    # ✅ Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t netflix-clone .

    # ✅ Tag Docker Image
    - name: Tag Image
      run: |
        docker tag netflix-clone:latest \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/netflix-clone:latest

    # ✅ Push to ECR
    - name: Push to ECR
      run: |
        docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/netflix-clone:latest

    # ✅ Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/netflix-clone:latest
          docker stop netflix || true
          docker rm netflix || true
          docker run -d -p 80:80 --name netflix \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/netflix-clone:latest
